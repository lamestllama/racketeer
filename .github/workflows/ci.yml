name: CI

# CI runs when asked for, not on every push. Dispatch the workflow before a
# release, with platforms linux, macos, windows or all. A pull request runs Linux
# only. Windows and macOS runners cost more, macOS ten times Linux. Each platform
# has its own concurrency group, so dispatches of different platforms run side by side.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to test
        type: choice
        options: [linux, macos, windows, all]
        default: linux

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platforms || github.event_name }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / Racket ${{ matrix.racket }}
    runs-on: ${{ matrix.os }}
    # The 430 Node tests took 32 minutes on macOS with Racket 9.1 and reached
    # test 382 of 430 at the 45-minute mark with Racket 9.3, so the slowest
    # entry needs about 52 minutes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'all' && '["ubuntu-24.04","windows-2022","macos-15"]' || inputs.platforms == 'macos' && '["macos-15"]' || inputs.platforms == 'windows' && '["windows-2022"]' || '["ubuntu-24.04"]') }}
        racket: ['9.1', stable]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        if: runner.os != 'macOS'
        with:
          version: ${{ matrix.racket }}
          architecture: ${{ matrix.os == 'macos-15' && 'arm64' || 'x64' }}
          distribution: full
          variant: CS
      - name: Install Racket with preserved timestamps
        if: runner.os == 'macOS'
        env:
          RACKET_VERSION: ${{ matrix.racket }}
          RACKET_ARCH: ${{ matrix.os == 'macos-15' && 'arm64' || 'x64' }}
        run: bash scripts/install-racket-macos.sh "$RACKET_VERSION" "$RACKET_ARCH"
      - name: Record environment
        run: |
          mkdir -p .test-output/ci
          { racket --version; node --version; npm --version; python --version; } | tee .test-output/ci/environment.log
      - name: Install locked build dependencies
        run: npm ci --prefix vscode
      - name: Build the extension offline
        env:
          npm_config_offline: 'true'
        run: node scripts/package-extension.js | tee .test-output/ci/package.log
      - name: Run native, protocol, lifecycle and build tests
        id: headless
        run: node scripts/test-headless.js 2>&1 | tee .test-output/ci/headless.log
      - name: Diagnose failed macOS language loads
        if: ${{ failure() && runner.os == 'macOS' && steps.headless.outcome == 'failure' }}
        timeout-minutes: 15
        run: python scripts/diagnose-language-loads.py 2>&1 | tee .test-output/ci/language-load-diagnostic.log
      - name: Verify the artifact and checkout
        run: |
          node scripts/artifact.js verify "$(node -p "'dist/' + require('./vscode/package.json').name + '-' + require('./vscode/package.json').version + '.vsix'")"
          git diff --exit-code
      - name: Retain core results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ matrix.os }}-racket-${{ matrix.racket }}
          include-hidden-files: true
          path: .test-output/ci/
          if-no-files-found: warn
          retention-days: 14

  editor:
    name: Installed extension / ${{ matrix.os }} / Racket ${{ matrix.racket }} / VS Code ${{ matrix.code }}
    runs-on: ${{ matrix.os }}
    # Locally the integration run takes 16 minutes and dogfooding 11. The
    # runners took 1.4 to 2 times as long, and Windows a further 1.6 times
    # Linux, so the slowest entry needs about 2 hours for its three runs.
    timeout-minutes: 150
    # Logs each analysis worker's start and stop to the retained language server
    # output, so that a stalled workspace index names the wait it stuck in.
    env:
      RACKETEER_INDEX_TRACE: '1'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'all' && '[{"os":"ubuntu-24.04","architecture":"x64","racket":"9.1","code":"minimum"},{"os":"ubuntu-24.04","architecture":"x64","racket":"9.1","code":"stable"},{"os":"ubuntu-24.04","architecture":"x64","racket":"stable","code":"stable"},{"os":"windows-2022","architecture":"x64","racket":"9.1","code":"stable"},{"os":"macos-15","architecture":"arm64","racket":"9.1","code":"stable"}]' || inputs.platforms == 'macos' && '[{"os":"macos-15","architecture":"arm64","racket":"9.1","code":"stable"}]' || inputs.platforms == 'windows' && '[{"os":"windows-2022","architecture":"x64","racket":"9.1","code":"stable"}]' || '[{"os":"ubuntu-24.04","architecture":"x64","racket":"9.1","code":"minimum"},{"os":"ubuntu-24.04","architecture":"x64","racket":"9.1","code":"stable"},{"os":"ubuntu-24.04","architecture":"x64","racket":"stable","code":"stable"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        if: runner.os != 'macOS'
        with:
          version: ${{ matrix.racket }}
          architecture: ${{ matrix.architecture }}
          distribution: full
          variant: CS
      - name: Install Racket with preserved timestamps
        if: runner.os == 'macOS'
        env:
          RACKET_VERSION: ${{ matrix.racket }}
          RACKET_ARCH: ${{ matrix.architecture }}
        run: bash scripts/install-racket-macos.sh "$RACKET_VERSION" "$RACKET_ARCH"
      - name: Install display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0 libnss3 libasound2t64
      - name: Record environment
        run: |
          mkdir -p .test-output/ci
          { racket --version; node --version; npm --version; python --version; } | tee .test-output/ci/environment.log
      - name: Install locked build dependencies
        run: npm ci --prefix vscode
      - name: Download the selected editor
        id: editor
        env:
          EDITOR_VERSION: ${{ matrix.code }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const { downloadAndUnzipVSCode } = require('./vscode/node_modules/@vscode/test-electron');
          const manifest = require('./vscode/package.json');
          const version = process.env.EDITOR_VERSION === 'minimum'
            ? manifest.engines.vscode.replace(/^\^/, '') : process.env.EDITOR_VERSION;
          downloadAndUnzipVSCode({ version, cachePath: path.join(process.env.RUNNER_TEMP, 'vscode-test') })
            .then(executable => {
              fs.writeFileSync('.test-output/ci/editor.json', JSON.stringify({
                requested: version, executable
              }, null, 2) + '\n');
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `executable=${executable}\n`);
            })
            .catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Build the extension offline
        id: artifact
        env:
          npm_config_offline: 'true'
        run: |
          node scripts/package-extension.js | tee .test-output/ci/package.log
          node -e 'const p = require("./vscode/package.json"); require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, `path=dist/${p.name}-${p.version}.vsix\n`);'
      - name: Check editor orchestration
        run: python tests/harness-checks.py
      - name: Compile standalone GUI test programs
        run: raco make racketdap/main.rkt racketdap/worker/main.rkt racketdap/tools/macro-stepper.rkt tests/support/macro-stepper-gui.rkt
      - name: Run GUI regressions
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python scripts/test-gui.py 2>&1 | tee .test-output/ci/gui.log
          else
            node --test --test-concurrency=1 tests/gui-parity.test.js tests/macro-stepper-gui.test.js 2>&1 | tee .test-output/ci/gui.log
          fi
      - name: Run bundled language-server regressions
        if: runner.os == 'Linux'
        env:
          PLTCOLLECTS: '${{ github.workspace }}/vendor/collects:'
        run: |
          xvfb-run -a raco test vendor/collects/racket-langserver/tests/lib/doc-test.rkt vendor/collects/racket-langserver/tests/lsp/workspace-lifecycle-test.rkt vendor/collects/racket-langserver/tests/lsp/analysis-wait-test.rkt 2>&1 | tee .test-output/ci/language.log
      - name: Test the installed extension
        id: integration
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        env:
          TEST_EDITOR: ${{ steps.editor.outputs.executable }}
          TEST_ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: python scripts/test-vscode.py --code "$TEST_EDITOR" --artifact "$TEST_ARTIFACT" --timeout 2700
      - name: Test the installed extension with the pinned Rhombus runtime
        if: ${{ !cancelled() && steps.integration.outcome == 'success' }}
        env:
          TEST_EDITOR: ${{ steps.editor.outputs.executable }}
          TEST_ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: python scripts/test-vscode.py --rhombus --code "$TEST_EDITOR" --artifact "$TEST_ARTIFACT" --timeout 3600
      - name: Run and debug the repository tests through Test Explorer
        if: ${{ !cancelled() && steps.artifact.outcome == 'success' }}
        env:
          TEST_EDITOR: ${{ steps.editor.outputs.executable }}
          TEST_ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: python scripts/test-vscode.py --dogfood --code "$TEST_EDITOR" --artifact "$TEST_ARTIFACT" --timeout 2700
      - name: Verify the artifact and checkout
        env:
          TEST_ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: |
          node scripts/artifact.js verify "$TEST_ARTIFACT"
          git diff --exit-code
      - name: Retain the tested artifact and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-${{ matrix.os }}-racket-${{ matrix.racket }}-code-${{ matrix.code }}
          include-hidden-files: true
          path: |
            dist/*.vsix
            dist/*.vsix.build.json
            .test-output/ci/
            .test-output/**/latest.json
            .test-output/**/vscode-report.json
            .test-output/**/editor-result.json
            .test-output/**/vscode.log
            .test-output/**/install.log
            .test-output/**/xvfb.log
            .test-output/**/language-server.log
            .test-output/**/user/logs/**/*Racket Language Server.log
            .test-output/**/user/logs/**/exthost.log
            .test-output/**/rhombus-runtime.json
            .test-output/**/rhombus-runtime-lock.json
            .test-output/**/rhombus-install.log
            .test-output/**/rhombus-probe.log
          if-no-files-found: warn
          retention-days: 14
