name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-load:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: 9.1
          architecture: arm64
          distribution: full
          variant: CS
      - name: Measure fresh image loads
        run: |
          mkdir -p .test-output/ci
          python <<'PYTHON' 2>&1 | tee .test-output/ci/image-load.log
          import importlib.util
          import json
          from pathlib import Path
          import shutil
          import tempfile
          spec = importlib.util.spec_from_file_location('diagnostic', 'scripts/diagnose-language-loads.py')
          diagnostic = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(diagnostic)
          root = Path.cwd()
          racket = shutil.which('racket')
          with tempfile.TemporaryDirectory(prefix='image-load-') as temporary:
              folder = Path(temporary)
              driver = folder / 'driver.rkt'
              driver.write_text('#lang racket/base\n'
                  + '(require (file ' + json.dumps(str(root / 'racketdap/worker/load.rkt')) + '))\n'
                  + '(run-module (string->path (vector-ref (current-command-line-arguments) 0)))\n')
              program = folder / 'images.rkt'
              shutil.copyfile(root / 'examples/images.rkt', program)
              results = []
              for repeat in range(3):
                  results.append(diagnostic.run_case(f'direct {repeat}', [racket, program], 120))
                  results.append(diagnostic.run_case(f'instrumented {repeat}', [racket, driver, program], 120))
              print(json.dumps(results, indent=2))
          PYTHON
      - name: Measure image protocol regression
        run: node --test --test-name-pattern='image, pict and plot results' tests/images.test.js 2>&1 | tee .test-output/ci/image-protocol.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: image-load-macos
          include-hidden-files: true
          path: .test-output/ci/
